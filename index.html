<html lang="en">

<title>Find Your Product · Danya Collyer</title>

<style>:root{
  --bg:#F3EFE8; --surface:#FBF9F5; --ink:#2A2521; --muted:#6E655D; --line:#E3DBD0; --mist:#F5E3D8; --blush:#E6B5A0;
  --orange:#D8693A; --on-orange:#2A2521; --accent:#AE4A1E;
  --panel:#2A2521; --panel-ink:#F3EFE8; --panel-soft:#CFC6BC;
  --good:#6B8656; --warn:#B0782A; --bad:#B3261E;
  --serif:"Newsreader","Iowan Old Style",Georgia,serif;
  --sans:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --cond:"Oswald","Arial Narrow",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1E1A17; --surface:#28231F; --ink:#F2ECE4; --muted:#B3A89D; --line:#3B342E; --mist:#3A2A22; --blush:#C98B6E;
    --orange:#E27B4A; --on-orange:#1E1A17; --accent:#F0976A;
    --panel:#140F0C; --panel-ink:#F3EFE8; --panel-soft:#CFC6BC;
    --good:#9DBE8B; --warn:#E2B36A; --bad:#F2B8B5;
  }
}
:root[data-theme="dark"]{
  --bg:#1E1A17; --surface:#28231F; --ink:#F2ECE4; --muted:#B3A89D; --line:#3B342E; --mist:#3A2A22; --blush:#C98B6E;
  --orange:#E27B4A; --on-orange:#1E1A17; --accent:#F0976A;
  --panel:#140F0C; --panel-ink:#F3EFE8; --panel-soft:#CFC6BC;
  --good:#9DBE8B; --warn:#E2B36A; --bad:#F2B8B5;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
.wrap{max-width:760px;margin:0 auto;padding:32px clamp(24px,6vw,40px) 72px}
header.brand{display:flex;align-items:center;gap:12px;margin-bottom:52px}
.medallion{width:42px;height:42px;border-radius:50%;background:var(--orange);color:var(--on-orange);display:grid;place-items:center;font-family:var(--cond);font-weight:600;font-size:15px;letter-spacing:.04em;flex:none}
.brand strong{display:block;font-family:var(--cond);font-weight:700;text-transform:uppercase;letter-spacing:.02em;font-size:17px;line-height:1.1}
.brand small{display:block;color:var(--muted);font-size:13px;line-height:1.3;margin-top:2px}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(40px,8vw,62px);line-height:1.04;letter-spacing:-.01em;margin:0 0 20px}
h2{font-family:var(--serif);font-weight:400;font-size:clamp(28px,5vw,38px);line-height:1.12;margin:0 0 14px}
h3{font-family:var(--cond);font-weight:600;text-transform:uppercase;letter-spacing:.04em;font-size:17px;margin:0 0 6px;color:var(--accent)}
p{margin:0 0 16px}
.kick{display:inline-flex;align-items:center;gap:10px;font-family:var(--cond);font-weight:500;text-transform:uppercase;letter-spacing:.08em;font-size:15px;color:var(--accent);margin-bottom:16px}
.kick svg{width:22px;height:22px;flex:none}
.lede{font-size:clamp(18px,2.4vw,20px);line-height:1.55;color:var(--muted);max-width:34em;margin-bottom:34px}
.paths{display:grid;gap:14px}
.path{all:unset;box-sizing:border-box;cursor:pointer;display:block;padding:24px 26px;background:var(--surface);border:1px solid var(--line);border-radius:16px;position:relative;transition:border-color .15s,box-shadow .15s}
.path::after{content:"\2192";position:absolute;right:24px;top:22px;font-family:var(--cond);font-size:24px;color:var(--orange)}
.path:hover{border-color:var(--orange);box-shadow:0 18px 36px -26px rgba(90,40,15,.55)}
.path:focus-visible,.opt:focus-visible,.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--orange);outline-offset:3px}
.path .t{font-family:var(--serif);font-size:26px;line-height:1.2;display:block;margin:0 36px 6px 0}
.path .d{color:var(--muted);font-size:15.5px;display:block}
.verse{margin-top:44px;padding:20px 22px;border-radius:14px;background:var(--mist);font-family:var(--serif);font-style:italic;font-size:19px;line-height:1.45}
.verse span{font-style:normal;font-family:var(--cond);font-weight:500;text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--accent);display:block;margin-top:8px}
.progress{height:8px;background:var(--line);border-radius:999px;margin:0 0 12px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--orange);border-radius:999px;transition:width .3s}
.step{font-family:var(--cond);font-weight:500;text-transform:uppercase;letter-spacing:.06em;font-size:14px;color:var(--muted);margin-bottom:30px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.back{all:unset;cursor:pointer;color:var(--muted);font-family:var(--sans);font-size:14px;text-transform:none;letter-spacing:0;text-decoration:underline;text-underline-offset:3px}
.back:focus-visible{outline:2px solid var(--orange);outline-offset:3px}
.help{color:var(--muted);margin-bottom:22px}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:block;padding:16px 20px;background:var(--surface);border:1px solid var(--line);border-radius:12px;font-size:16.5px;line-height:1.4;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--blush)}
.opt[aria-pressed="true"]{border-color:var(--orange);box-shadow:inset 0 0 0 1px var(--orange);background:var(--mist)}
.opt small{display:block;color:var(--muted);font-size:14px;margin-top:2px}
label.f{display:block;font-weight:600;font-size:15px;margin:0 0 8px}
input[type=text],input[type=number],textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 15px}
input[type=text]:focus,input[type=number]:focus,textarea:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px var(--mist)}
textarea{min-height:96px;resize:vertical}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-block;padding:15px 28px;background:var(--orange);color:var(--on-orange);font-family:var(--cond);font-weight:500;text-transform:uppercase;letter-spacing:.06em;font-size:18px;line-height:1.2;border-radius:4px;text-align:center;transition:background .2s,color .2s}
.btn:hover{background:var(--accent);color:#fff}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink);font-size:16px;padding:12px 22px}
.btn.ghost:hover{background:var(--ink);color:var(--bg)}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.error{color:var(--bad);font-size:14px;margin-top:8px;min-height:1em}
.cover{background:var(--panel);color:var(--panel-ink);border-radius:20px;padding:40px 32px 34px;position:relative;overflow:hidden;margin-bottom:40px;animation:reveal .6s ease-out both}
.cover::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:var(--orange);opacity:.18;pointer-events:none}
.cover .medallion{margin-bottom:24px}
.cover .kicker{font-family:var(--cond);font-weight:500;text-transform:uppercase;letter-spacing:.1em;font-size:14px;color:var(--blush);margin-bottom:10px}
.cover .title{font-family:var(--serif);font-size:clamp(32px,6.5vw,50px);line-height:1.06;margin:0 0 20px;font-weight:400;position:relative}
.cover .meta{display:flex;flex-wrap:wrap;gap:10px;font-size:14.5px;color:var(--panel-soft)}
.cover .meta span{background:rgba(243,239,232,.08);border:1px solid rgba(243,239,232,.14);border-radius:999px;padding:6px 14px}
.cover .meta b{color:var(--panel-ink);font-weight:600}
@keyframes reveal{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.cover{animation:none}.progress i{transition:none}}
section.block{margin:0 0 40px}
section.block>h2{font-size:30px}
.alts{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.alts li{padding:16px 20px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-family:var(--serif);font-size:21px;line-height:1.3}
.hooks{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.hooks li{padding:16px 20px;background:var(--mist);border-radius:12px}
.hooks li em{display:block;font-style:normal;font-family:var(--cond);font-weight:500;text-transform:uppercase;letter-spacing:.07em;font-size:13px;color:var(--accent);margin-bottom:4px}
.calc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px}
.row{margin-bottom:20px}
.row .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:15px;margin-bottom:6px}
.row .top output{font-family:var(--cond);font-weight:600;font-size:18px;color:var(--accent);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--orange)}
.priceIn{display:flex;align-items:center;gap:8px;max-width:180px}
.priceIn input{padding:10px 12px}
.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-top:6px;padding-top:20px;border-top:1px solid var(--line)}
.totals div{font-size:14px;color:var(--muted)}
.totals strong{display:block;font-family:var(--cond);font-weight:700;font-size:44px;color:var(--orange);line-height:1.05;font-variant-numeric:tabular-nums}
.fine{font-size:13px;color:var(--muted);margin-top:14px;margin-bottom:0}
.next{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--orange);border-radius:12px;padding:20px 22px}
.next p{margin:0}
.score{display:flex;align-items:center;gap:24px;flex-wrap:wrap;position:relative}
.ring{--p:0;width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--orange) calc(var(--p)*1%),rgba(255,255,255,.12) 0);display:grid;place-items:center;flex:none}
.ring span{width:96px;height:96px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-family:var(--cond);font-weight:700;font-size:38px}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.checks li{padding:16px 20px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.checks li b{display:block;font-size:15.5px;margin-bottom:2px}
.checks li.lo{border-left:4px solid var(--warn)}
.checks li.hi{border-left:4px solid var(--good)}
.checks p{margin:0;color:var(--muted);font-size:15px}
.pitch{margin:52px 0 10px;border-radius:22px;overflow:hidden;background:var(--surface);border:2px solid var(--orange)}
.pitch .mockwrap{background:var(--mist)}
.pitch .mock{display:block;width:100%;height:auto}
.pitch .body{padding:30px clamp(22px,5vw,36px) 34px}
.pitch h2{font-size:clamp(30px,5.5vw,40px)}
.pitch p{max-width:36em}
.pitch .incl{list-style:none;margin:18px 0 22px;padding:0;display:grid;gap:8px}
.pitch .incl li{display:flex;gap:12px;font-size:16px;line-height:1.45}
.pitch .incl li::before{content:"\2713";flex:none;width:22px;height:22px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:1px}
.pitch .quote{margin:0 0 24px;padding:16px 20px;background:var(--mist);border-radius:12px;font-family:var(--serif);font-style:italic;font-size:19px;line-height:1.4}
.pitch .quote span{display:block;font-style:normal;font-family:var(--cond);font-weight:500;text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--accent);margin-top:6px}
.pitch .buy{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.pitch .price{font-family:var(--cond);font-weight:700;font-size:48px;line-height:1;color:var(--accent)}
.pitch .btn{font-size:19px;padding:17px 30px}
footer{margin-top:56px;padding-top:20px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
footer a{color:inherit}
</style>
</head>

/* ---------- Views ---------- */
function home(){
  return '<div class="kick">'+AST+'Free tool: Find your product</div><h1>What are you called to create?</h1>'+
  '<p class="lede">Find the digital product that fits your gifts, your story and your season, or test the idea you already have before you spend weeks building it.</p>'+
  '<div class="paths">'+
    '<button class="path" data-act="find"><span class="t">Help me find my product</span><span class="d">Five quick questions. You\u2019ll get a product idea, a price range, a profit estimate and hooks to start promoting it.</span></button>'+
    '<button class="path" data-act="validate"><span class="t">Test the idea I already have</span><span class="d">Six honest questions. You\u2019ll get a readiness score and exactly what to strengthen before you launch.</span></button>'+
  '</div>'+
  '<p class="verse">\u201cCommit your work to the LORD, and your plans will be established.\u201d<span>Proverbs 16:3 (ESV)</span></p>';
}

function question(list){
  var q=list[S.i], total=list.length, pct=Math.round((S.i)/total*100);
  var h='<div class="progress" aria-hidden="true"><i style="width:'+pct+'%"></i></div>'+
    '<div class="step"><span>Question '+(S.i+1)+' of '+total+'</span><button class="back" data-act="back">Back</button></div>'+
    '<h2>'+esc(q.q)+'</h2>'+(q.help?'<p class="help">'+esc(q.help)+'</p>':'')+
    '<div class="opts'+(q.two?' two':'')+'" role="group" aria-label="'+esc(q.q)+'">';
  q.opts.forEach(function(o){
    var sel=String(S.a[q.key])===String(o[0]);
    h+='<button class="opt" data-pick="'+esc(o[0])+'" aria-pressed="'+sel+'">'+esc(o[1])+(o[2]?'<small>'+esc(o[2])+'</small>':'')+'</button>';
  });
  h+='</div>';
  if(q.key==="topic"&&S.a.topic==="other"){
    h+='<div class="row" style="margin-top:22px"><label class="f" for="custom">What do people come to you for?</label>'+
      '<input id="custom" type="text" maxlength="40" placeholder="e.g. Photography, homeschooling, public speaking" value="'+esc(S.custom)+'">'+
      '<div class="error" id="err"></div></div>'+
      '<div class="actions" style="margin-top:8px"><button class="btn" data-act="customNext">Continue</button></div>';
  }
  return h;
}

function ideaStep(){
  return '<div class="progress" aria-hidden="true"><i style="width:0%"></i></div>'+
  '<div class="step"><span>Before we start</span><button class="back" data-act="home">Back</button></div>'+
  '<h2>Tell me about your idea</h2>'+
  '<label class="f" for="idea">What\u2019s the product?</label>'+
  '<textarea id="idea" placeholder="e.g. A 30-day prayer journal for moms who want to pray with more confidence">'+esc(S.idea)+'</textarea>'+
  '<div class="row" style="margin-top:20px"><label class="f" for="price">What would you charge?</label>'+
  '<div class="priceIn"><span>$</span><input id="price" type="number" min="1" step="1" inputmode="numeric" value="'+S.price+'"></div></div>'+
  '<div class="error" id="err"></div>'+
  '<div class="actions"><button class="btn" data-act="startVal">Start the questions</button></div>';
}

function calc(price, audKey){
  var n=AUDIENCE[audKey||"small"].n;
  return '<div class="calc" id="calc">'+
    '<div class="row"><div class="top"><label for="cPrice">Price</label><output id="oPrice"></output></div><input id="cPrice" type="range" min="7" max="997" step="1" value="'+price+'"></div>'+
    '<div class="row"><div class="top"><label for="cAud">Followers + subscribers</label><output id="oAud"></output></div><input id="cAud" type="range" min="200" max="50000" step="100" value="'+n+'"></div>'+
    '<div class="row"><div class="top"><label for="cConv">Buy rate of people who see the offer</label><output id="oConv"></output></div><input id="cConv" type="range" min="0.5" max="5" step="0.5" value="2"></div>'+
    '<div class="totals"><div><strong id="tLaunch"></strong>from one launch</div><div><strong id="tYear"></strong>in a year, promoting monthly</div></div>'+
    '<p class="fine">This is an estimate, not a promise. It assumes about 1 in 4 of your audience sees a launch, and that monthly promotion afterward brings in about half a launch\u2019s sales each month.</p>'+
  '</div>';
}
function wireCalc(){
  var p=document.getElementById("cPrice");if(!p)return;
  var a=document.getElementById("cAud"),c=document.getElementById("cConv");
  function upd(){
    var price=+p.value,aud=+a.value,conv=+c.value/100;
    var buyers=aud*0.25*conv, launch=buyers*price, year=launch+launch*0.5*11;
    document.getElementById("oPrice").textContent=money(price);
    document.getElementById("oAud").textContent=aud.toLocaleString("en-US");
    document.getElementById("oConv").textContent=c.value+"%";
    document.getElementById("tLaunch").textContent=money(launch);
    document.getElementById("tYear").textContent=money(year);
  }
  [p,a,c].forEach(function(el){el.addEventListener("input",upd)});upd();
}

function findResult(){
  var t=topicFor(),e=EXPERIENCE[S.a.exp],f=FORMATS[S.a.style][S.a.time];
  var lo=Math.round(f.lo*e.mult),hi=Math.round(f.hi*e.mult);
  var suggested=Math.round((lo+hi)/2);
  var main=t.outcome+" in "+f.days+" Days";
  var alts=["The "+t.theme+" "+f.name,"From "+t.painShort+" to "+t.resultShort];
  var article=/^[AEIOU]/i.test(f.name)?"an":"a";
  var hooks=[
    ["Identity hook","I\u2019m a "+t.who+" and I was done "+t.painDone+"."],
    ["Curiosity hook","The one shift that finally helped me "+t.result+"."],
    ["Transformation hook","How I went from "+t.painShort.toLowerCase()+" to "+t.resultShort.toLowerCase()+", and the "+f.days+"-day plan I\u2019d give you."],
    ["POV hook","POV: you stopped "+t.painDone+" and started "+t.resultIng+"."]
  ];
  S.summary=["My product blueprint","","Product: "+main+" ("+f.name+")","Other titles: "+alts.join(" / "),"Price range: "+money(lo)+"–"+money(hi),"Build time: "+f.build,"","Hooks:"].concat(hooks.map(function(h){return"- "+h[1]})).join("\n");
  return '<div class="cover">'+
    '<div class="medallion" aria-hidden="true">DC</div>'+
    '<div class="kicker">Your product blueprint</div>'+
    '<p class="title">'+esc(main)+'</p>'+
    '<div class="meta"><span>Format <b>'+esc(f.name)+'</b></span><span>Price <b>'+money(lo)+'–'+money(hi)+'</b></span><span>Build time <b>'+esc(f.build)+'</b></span></div>'+
  '</div>'+
  '<section class="block"><h2>Why this fits you</h2>'+
    '<p>You teach best through '+({writing:"writing",tools:"practical tools",video:"video",live:"live experiences"})[S.a.style]+', and you have '+esc(f.build)+' to build. '+article+' '+esc(f.name.toLowerCase())+' lets you deliver a real win without overbuilding.</p>'+
    '<p>'+esc(e.note)+'</p></section>'+
  '<section class="block"><h2>Other titles to try</h2><ul class="alts">'+alts.map(function(x){return'<li>'+esc(x)+'</li>'}).join("")+'</ul></section>'+
  '<section class="block"><h2>What could it earn?</h2><p class="help">Move the sliders to match your real numbers.</p>'+calc(suggested,S.a.aud)+'</section>'+
  '<section class="block"><h2>Start promoting it this week</h2><p class="help">Four hooks built on the Content Formula. Tweak the words so they sound like you.</p><ul class="hooks">'+
    hooks.map(function(h){return'<li><em>'+h[0]+'</em>'+esc(h[1])+'</li>'}).join("")+'</ul></section>'+
  '<section class="block next"><h3>Your next step</h3><p>Before you build anything, post two of these hooks this week and put a waitlist link in your bio. Pay attention to who replies. Those people are your first buyers.</p></section>'+
  pitch("You have your product idea, your price and your hooks. Don\u2019t let it sit in your notes app. The fastest way forward is to build the first version while the idea is fresh.")+
  '<div class="actions"><button class="btn ghost" data-act="copy">Copy my blueprint</button><button class="btn ghost" data-act="home">Start over</button></div><div class="error" id="copyMsg" role="status"></div>';
}

function valResult(){
  var pts=0;VAL_Q.forEach(function(q){pts+=+S.a[q.key]});
  var pct=Math.round(pts/(VAL_Q.length*2)*100);
  var verdict=pct>=75?["Green light","This idea is ready. Build the first version, open a waitlist, and start talking about it now."]
    :pct>=45?["Refine it first","There\u2019s something real here. Strengthen the areas marked below before you invest weeks building."]
    :["Rework the idea","Don\u2019t throw it out, but don\u2019t build it yet. Use the notes below to reshape it into something people are ready to buy."];
  var sorted=VAL_Q.slice().sort(function(a,b){return S.a[a.key]-S.a[b.key]});
  S.summary=["Idea check: "+S.idea,"Score: "+pct+"/100 ("+verdict[0]+")",""].concat(sorted.map(function(q){return(+S.a[q.key]===2?"Strong: ":"Work on: ")+q.q+" "+(+S.a[q.key]===2?q.hi:q.lo)})).join("\n");
  return '<div class="cover">'+
    '<div class="kicker">Your idea check</div>'+
    '<p class="title">'+esc(S.idea)+'</p>'+
    '<div class="score"><div class="ring" style="--p:'+pct+'" role="img" aria-label="Score '+pct+' out of 100"><span>'+pct+'</span></div>'+
    '<div><p style="font-family:var(--serif);font-size:26px;margin:0 0 6px">'+verdict[0]+'</p><p style="margin:0;color:var(--panel-soft)">'+verdict[1]+'</p></div></div>'+
  '</div>'+
  '<section class="block"><h2>What to strengthen</h2><ul class="checks">'+
    sorted.map(function(q){var hi=+S.a[q.key]===2;return'<li class="'+(hi?"hi":"lo")+'"><b>'+esc(q.q)+'</b><p>'+esc(hi?q.hi:q.lo)+'</p></li>'}).join("")+
  '</ul></section>'+
  '<section class="block"><h2>What could it earn?</h2><p class="help">Move the sliders to match your real numbers.</p>'+calc(S.price,"small")+'</section>'+
  pitch("You\u2019ve tested your idea. Now it\u2019s time to shape it into something people can buy. Strengthen the areas above, then build the first version while the idea is fresh.")+
  '<div class="actions"><button class="btn ghost" data-act="copy">Copy my results</button><button class="btn ghost" data-act="home">Start over</button></div><div class="error" id="copyMsg" role="status"></div>';
}

function render(){
  var h;
  if(S.view==="home")h=home();
  else if(S.view==="find")h=question(FIND_Q);
  else if(S.view==="idea")h=ideaStep();
  else if(S.view==="val")h=question(VAL_Q);
  else if(S.view==="findResult")h=findResult();
  else h=valResult();
  app.innerHTML=h;wireCalc();wireTimer();
}

/* ---------- Events ---------- */
app.addEventListener("click",function(ev){
  var b=ev.target.closest("button");if(!b)return;
  var act=b.getAttribute("data-act"),pick=b.getAttribute("data-pick");
  if(pick!==null){
    var list=S.view==="find"?FIND_Q:VAL_Q;
    S.a[list[S.i].key]=pick;
    if(list[S.i].key==="topic"&&pick==="other"){render();var ci=document.getElementById("custom");if(ci)ci.focus();return}
    if(S.i<list.length-1){S.i++;go(S.view)}
    else go(S.view==="find"?"findResult":"valResult");
    return;
  }
  if(act==="find"){S.a={};S.i=0;go("find")}
  else if(act==="validate"){S.a={};S.i=0;go("idea")}
  else if(act==="home"){go("home")}
  else if(act==="customNext"){
    var v=document.getElementById("custom").value.trim().replace(/[.!?]+$/,"");
    if(v.length<3){document.getElementById("err").textContent="Type a topic in a few words to continue.";return}
    S.custom=v;S.i++;go("find");
  }
  else if(act==="back"){if(S.i>0){S.i--;go(S.view)}else go(S.view==="val"?"idea":"home")}
  else if(act==="startVal"){
    var idea=document.getElementById("idea").value.trim(),price=parseInt(document.getElementById("price").value,10);
    var err=document.getElementById("err");
    if(!idea){err.textContent="Describe your idea in a sentence to continue.";return}
    if(!(price>0)){err.textContent="Enter a price in whole dollars to continue.";return}
    S.idea=idea;S.price=Math.min(price,997);go("val");
  }
  else if(act==="copy"){
    var msg=document.getElementById("copyMsg");
    try{
      navigator.clipboard.writeText(S.summary).then(function(){msg.style.color="var(--good)";msg.textContent="Copied. Paste it into your notes."},function(){fallback()});
    }catch(e){fallback()}
    function fallback(){
      var ta=document.createElement("textarea");ta.value=S.summary;document.body.appendChild(ta);ta.select();
      var ok=false;try{ok=document.execCommand("copy")}catch(e){}
      document.body.removeChild(ta);
      msg.style.color=ok?"var(--good)":"var(--bad)";
      msg.textContent=ok?"Copied. Paste it into your notes.":"Copying isn\u2019t allowed here. Take a screenshot to save your results.";
    }
  }
});

app.addEventListener("keydown",function(ev){
  if(ev.key==="Enter"&&ev.target.id==="custom"){ev.preventDefault();var b=app.querySelector('[data-act="customNext"]');if(b)b.click()}
});

document.getElementById("yr").textContent=new Date().getFullYear();
render();
})();
</script>
</body>
</html>
