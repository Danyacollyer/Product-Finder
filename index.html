<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kingdom Product Finder · Danya Collyer</title>
<meta name="description" content="Find the digital product you're called to create, or test the idea you already have.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF7ED; --surface:#FFFDF6; --ink:#2C2B20; --muted:#6B6A5C; --line:#E2DCCB; --olive:#5F613D; --olive-ink:#FAF7ED; --tan:#B39B84; --mist:#F0ECDD; --panel:#271C13; --panel-ink:#FAF7ED; --panel-soft:#D8CCBC; --good:#5F613D; --warn:#9C6B3F; --bad:#9A4747;
  --serif:"Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --sans:"Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1E1914; --surface:#28221B; --ink:#F3EEDF; --muted:#BDB5A3; --line:#3E362D; --olive:#A3A574; --olive-ink:#1E1914; --tan:#C9B29B; --mist:#322A22; --panel:#140F0B; --panel-ink:#FAF7ED; --panel-soft:#D8CCBC; --good:#A9B07C; --warn:#DDA878; --bad:#E08A8A;
  }
}
:root[data-theme="dark"]{
  --bg:#1E1914; --surface:#28221B; --ink:#F3EEDF; --muted:#BDB5A3; --line:#3E362D; --olive:#A3A574; --olive-ink:#1E1914; --tan:#C9B29B; --mist:#322A22; --panel:#140F0B; --panel-ink:#FAF7ED; --panel-soft:#D8CCBC; --good:#A9B07C; --warn:#DDA878; --bad:#E08A8A;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:40px 22px 72px}
header.brand{display:flex;align-items:center;gap:12px;margin-bottom:48px}
.medallion{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font-family:var(--serif);font-size:16px;letter-spacing:.02em;position:relative;flex:none}
.medallion::after{content:"";position:absolute;inset:3px;border-radius:50%;border:1px solid var(--tan)}
.brand small{display:block;color:var(--muted);font-size:13px;line-height:1.3}
.brand strong{font-weight:600;font-size:15px}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(40px,8vw,64px);line-height:1.02;letter-spacing:-.015em;margin:0 0 20px}
h2{font-family:var(--serif);font-weight:400;font-size:clamp(28px,5vw,38px);line-height:1.12;margin:0 0 14px}
h3{font-size:15px;font-weight:700;margin:0 0 6px}
p{margin:0 0 16px}
.lede{font-family:var(--serif);font-size:21px;line-height:1.45;color:var(--ink);max-width:34em;margin-bottom:36px}
.paths{display:grid;gap:14px}
.path{all:unset;cursor:pointer;display:block;padding:22px 24px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--olive);border-radius:4px;transition:border-color .15s,transform .15s}
.path:hover{border-color:var(--olive)}
.path:focus-visible,.opt:focus-visible,.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--olive);outline-offset:3px}
.path .t{font-family:var(--serif);font-size:24px;line-height:1.2;display:block;margin-bottom:4px}
.path .d{color:var(--muted);font-size:15px}
.verse{margin-top:48px;padding-top:20px;border-top:1px solid var(--line);font-family:var(--serif);font-style:italic;color:var(--muted);font-size:17px}
.verse span{font-style:normal;font-family:var(--sans);font-size:13px;display:block;margin-top:4px}
.progress{height:3px;background:var(--line);border-radius:2px;margin:0 0 10px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--olive);transition:width .3s}
.step{font-size:14px;color:var(--muted);margin-bottom:28px;display:flex;justify-content:space-between;gap:12px}
.back{all:unset;cursor:pointer;color:var(--muted);font-size:14px;text-decoration:underline;text-underline-offset:3px}
.back:focus-visible{outline:2px solid var(--olive);outline-offset:3px}
.help{color:var(--muted);margin-bottom:22px}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.opt{all:unset;cursor:pointer;display:block;padding:15px 18px;background:var(--surface);border:1px solid var(--line);border-radius:4px;font-size:16px;line-height:1.4}
.opt:hover{border-color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--olive);box-shadow:inset 0 0 0 1px var(--olive);background:var(--mist)}
.opt small{display:block;color:var(--muted);font-size:14px;margin-top:2px}
label.f{display:block;font-weight:600;font-size:15px;margin:0 0 8px}
input[type=text],input[type=number],textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:13px 15px}
textarea{min-height:90px;resize:vertical}
.btn{all:unset;cursor:pointer;display:inline-block;padding:14px 26px;background:var(--olive);color:var(--olive-ink);font-weight:600;font-size:15px;letter-spacing:.06em;border-radius:10px;text-align:center}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--olive);box-shadow:inset 0 0 0 1px var(--olive)}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.error{color:var(--bad);font-size:14px;margin-top:8px;min-height:1em}

/* Blueprint: the one bold moment */
.cover{background:var(--panel);color:var(--panel-ink);border-radius:6px;padding:40px 30px 34px;position:relative;overflow:hidden;margin-bottom:36px;animation:reveal .6s ease-out both}
.cover::before{content:"";position:absolute;inset:12px;border:1px solid rgba(179,155,132,.45);border-radius:3px;pointer-events:none}
.cover .medallion{border-color:var(--panel-ink);color:var(--panel-ink);margin-bottom:26px}
.cover .kicker{font-size:14px;color:var(--tan);margin-bottom:10px}
.cover .title{font-family:var(--serif);font-size:clamp(32px,6.5vw,50px);line-height:1.05;margin:0 0 18px;font-weight:400}
.cover .meta{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:15px;color:var(--panel-soft)}
.cover .meta b{color:var(--panel-ink);font-weight:600}
@keyframes reveal{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.cover{animation:none}.progress i{transition:none}}
section.block{margin:0 0 36px}
section.block>h2{font-size:28px}
.alts{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.alts li{padding:14px 18px;border:1px solid var(--line);border-radius:4px;background:var(--surface);font-family:var(--serif);font-size:20px;line-height:1.3}
.hooks{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.hooks li{padding:14px 18px;background:var(--mist);border-radius:4px}
.hooks li em{display:block;font-style:normal;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:2px}
.calc{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:24px}
.row{margin-bottom:20px}
.row .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:15px;margin-bottom:6px}
.row .top output{font-weight:700;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--olive)}
.priceIn{display:flex;align-items:center;gap:8px;max-width:180px}
.priceIn input{padding:10px 12px}
.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-top:6px;padding-top:20px;border-top:1px solid var(--line)}
.totals div{font-size:14px;color:var(--muted)}
.totals strong{display:block;font-family:var(--serif);font-weight:400;font-size:34px;color:var(--ink);line-height:1.1;font-variant-numeric:tabular-nums}
.fine{font-size:13px;color:var(--muted);margin-top:14px;margin-bottom:0}
.next{border-left:3px solid var(--tan);padding:4px 0 4px 18px}
.score{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.ring{--p:0;width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--tan) calc(var(--p)*1%),rgba(255,255,255,.12) 0);display:grid;place-items:center;flex:none}
.ring span{width:96px;height:96px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-family:var(--serif);font-size:34px}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.checks li{padding:14px 18px;border:1px solid var(--line);border-radius:4px;background:var(--surface)}
.checks li b{display:block;font-size:15px;margin-bottom:2px}
.checks li.lo{border-left:4px solid var(--warn)}
.checks li.hi{border-left:4px solid var(--good)}
.checks p{margin:0;color:var(--muted);font-size:15px}
h1,h2,.path .t,.cover .title,.alts li,.totals strong,.ring span{font-weight:500;font-optical-sizing:none;font-variation-settings:"opsz" 24}
h1{font-weight:600}
.pitch{margin:48px 0 8px;padding:30px 28px;background:var(--mist);border-top:3px solid var(--olive);border-radius:4px}
.pitch p{max-width:34em}
.challenge{margin:22px 0 24px;padding:20px 22px;background:var(--surface);border:1px solid var(--olive);border-radius:4px}
.challenge p{color:var(--muted);font-size:15px}
.timer{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:4px}
.timer div{text-align:center;padding:10px 4px;background:var(--panel);color:var(--panel-ink);border-radius:4px}
.timer strong{display:block;font-family:var(--serif);font-weight:500;font-size:clamp(26px,6vw,36px);line-height:1.1;font-variant-numeric:tabular-nums}
.timer span{font-size:12px;color:var(--panel-soft)}
.pitch .mock{display:block;width:100%;max-width:440px;height:auto;margin:-6px auto 18px}
.pitch .btn{margin-top:8px}
footer{margin-top:56px;font-size:13px;color:var(--muted)}
footer a{color:inherit}
</style>
</head>
<body>
<div class="wrap">
  <header class="brand">
    <div class="medallion" aria-hidden="true">DC</div>
    <div><strong>Danya Collyer</strong><small>Where Spirit Meets Strategy</small></div>
  </header>
  <main id="app" aria-live="polite"></main>
  <footer>© Danya Collyer · <a href="https://danyacollyer.com">danyacollyer.com</a></footer>
</div>

<script>
(function(){
"use strict";
var app=document.getElementById("app");

/* ---------- Content ---------- */
var TOPICS={
  faith:{label:"Prayer & faith",theme:"Prayer",outcome:"Pray With Authority",who:"believer",painDone:"praying the same routine prayers",painShort:"Routine Prayers",resultShort:"Bold Prayers",result:"pray with real confidence",resultIng:"praying with authority"},
  mindset:{label:"Mindset & identity",theme:"Mind Renewal",outcome:"Renew Your Mind",who:"believer",painDone:"replaying the same old thought patterns",painShort:"Stuck Thinking",resultShort:"a Renewed Mind",result:"break my old thought patterns",resultIng:"thinking like who God says I am"},
  business:{label:"Business & content",theme:"Kingdom Content",outcome:"Turn Followers Into Buyers",who:"Christian business owner",painDone:"posting content nobody buys from",painShort:"Posting Into the Void",resultShort:"Consistent Sales",result:"turn followers into buyers",resultIng:"posting with purpose"},
  wellness:{label:"Health & wellness",theme:"Healthy Rhythms",outcome:"Get Your Energy Back",who:"busy believer",painDone:"running on empty",painShort:"Running on Empty",resultShort:"Restored Energy",result:"get my energy back",resultIng:"living in healthy rhythms"},
  family:{label:"Marriage & family",theme:"Faith-Filled Home",outcome:"Build a Stronger Home",who:"spouse and parent",painDone:"feeling disconnected at home",painShort:"Disconnected",resultShort:"a Thriving Home",result:"reconnect with my family",resultIng:"leading my home with peace"},
  money:{label:"Money & stewardship",theme:"Stewardship",outcome:"Steward Your Money Well",who:"believer",painDone:"stressing over money every month",painShort:"Money Stress",resultShort:"Financial Peace",result:"finally get ahead with money",resultIng:"stewarding money with peace"},
  home:{label:"Home & organization",theme:"Ordered Home",outcome:"Bring Order to Your Home",who:"busy believer",painDone:"living in constant clutter",painShort:"Chaos",resultShort:"a Calm Home",result:"bring order to my home",resultIng:"running a calm, ordered home"},
  creative:{label:"A creative skill",theme:"Creative",outcome:"Master Your Craft",who:"creative",painDone:"stuck at the beginner level",painShort:"Beginner",resultShort:"Confident Creator",result:"level up my craft",resultIng:"creating work I'm proud of"}
};

/* format[style][time] */
var FORMATS={
  writing:{weekend:{name:"Workbook",days:7,lo:17,hi:27,build:"a weekend"},weeks:{name:"Guide",days:7,lo:27,hi:67,build:"2–4 weeks"},months:{name:"Signature Guide",days:30,lo:47,hi:97,build:"1–2 months"}},
  tools:{weekend:{name:"Template Kit",days:7,lo:17,hi:37,build:"a weekend"},weeks:{name:"Toolkit & Planner",days:30,lo:27,hi:57,build:"2–4 weeks"},months:{name:"Interactive Dashboard",days:30,lo:37,hi:97,build:"1–2 months"}},
  video:{weekend:{name:"Masterclass",days:7,lo:27,hi:47,build:"a weekend"},weeks:{name:"Mini-Course",days:7,lo:47,hi:97,build:"2–4 weeks"},months:{name:"Signature Course",days:30,lo:197,hi:497,build:"1–2 months"}},
  live:{weekend:{name:"Challenge",days:5,lo:17,hi:37,build:"a weekend"},weeks:{name:"5-Day Challenge",days:5,lo:27,hi:67,build:"2–4 weeks"},months:{name:"Group Program",days:30,lo:297,hi:997,build:"1–2 months"}}
};

var EXPERIENCE={
  lived:{label:"I walked through it myself",note:"Your testimony is the product. Lead with your story, then teach the steps.",mult:1},
  results:{label:"I've helped others get results",note:"You have proof. Collect 3–5 short testimonies before you launch and put them everywhere.",mult:1.15},
  credential:{label:"I'm trained or credentialed in it",note:"Your expertise lets you charge at the top of the range. Pair it with a personal story so it doesn't read like a textbook.",mult:1.3},
  ahead:{label:"I'm a few steps ahead of others",note:"You don't need to be the expert, just the guide who's one chapter ahead. Keep the promise specific and the price accessible.",mult:.85}
};

var AUDIENCE={tiny:{label:"Under 1,000",n:700},small:{label:"1,000–5,000",n:3000},mid:{label:"5,000–20,000",n:10000},big:{label:"20,000+",n:30000}};

var FIND_Q=[
  {key:"topic",q:"What do people already come to you for?",help:"Think about the questions that land in your DMs, or what friends call you about.",opts:Object.keys(TOPICS).map(function(k){return[k,TOPICS[k].label]}).concat([["other","Something else"]]),two:true},
  {key:"exp",q:"How do you know this topic?",opts:Object.keys(EXPERIENCE).map(function(k){return[k,EXPERIENCE[k].label]})},
  {key:"style",q:"How do you love to teach?",opts:[["writing","Writing it out","Guides, workbooks, devotionals"],["tools","Building tools","Templates, planners, trackers"],["video","On camera","Lessons and masterclasses"],["live","Live and together","Challenges, calls, community"]]},
  {key:"time",q:"How much time can you give to building it?",opts:[["weekend","A weekend"],["weeks","A few weeks"],["months","A month or two"]]},
  {key:"aud",q:"How many followers or email subscribers do you have?",opts:Object.keys(AUDIENCE).map(function(k){return[k,AUDIENCE[k].label]}),two:true}
];

var VAL_Q=[
  {key:"asked",q:"Do people already ask you about this?",opts:[[2,"Yes, all the time"],[1,"Sometimes"],[0,"Not really"]],
    lo:"Nobody's asking yet. Before you build, post about the problem for two weeks and watch which posts get saves, shares and DMs.",hi:"People already come to you for this. That's demand you don't have to create."},
  {key:"urgent",q:"How urgent is the problem it solves?",opts:[[2,"It keeps people up at night"],[1,"It's annoying but they're coping"],[0,"It's a nice-to-have"]],
    lo:"Nice-to-haves are hard to sell. Reframe the idea around a pain your buyer feels this week, not someday.",hi:"You're solving a problem people feel right now, so they're ready to act."},
  {key:"proof",q:"Have you seen this work?",opts:[[2,"Yes, for me and for others"],[1,"For me, not others yet"],[0,"Not yet"]],
    lo:"Run it free or at a beta price for 5–10 people first. Their results become your sales page.",hi:"You have proof, and proof sells better than any clever copy."},
  {key:"sentence",q:"Can you say the transformation in one sentence?",help:"\u201cI help ___ go from ___ to ___.\u201d",opts:[[2,"Yes, easily"],[1,"Kind of"],[0,"Not yet"]],
    lo:"If you can't say it in one sentence, your buyer can't either. Narrow it until the before and after are obvious.",hi:"A clear before-and-after makes every piece of content easier to write."},
  {key:"spend",q:"Do people already spend money on this kind of help?",opts:[[2,"Yes, there are paid products like it"],[1,"A few"],[0,"I haven't seen any"]],
    lo:"No competition can mean no market. Look for books, courses or coaches on this topic to confirm people pay for it.",hi:"A market already exists. Your angle and your story are what set you apart."},
  {key:"build",q:"Could you build the first version in 30 days?",opts:[[2,"Yes"],[1,"Maybe, if I simplify it"],[0,"No, it's a big project"]],
    lo:"Shrink the first version. Sell the smallest piece that gets someone a quick win, then expand.",hi:"You can get it into buyers' hands quickly and improve it from real feedback."}
];

function titleCase(s){return s.replace(/\w\S*/g,function(w){return w.length<4&&!/^[A-Z]/.test(w)?w:w.charAt(0).toUpperCase()+w.slice(1)}).replace(/^./,function(c){return c.toUpperCase()})}
function topicFor(){
  if(S.a.topic!=="other")return TOPICS[S.a.topic];
  var raw=S.custom, low=raw.charAt(0).toLowerCase()+raw.slice(1), T=titleCase(raw);
  return {label:raw,theme:T,outcome:"Level Up Your "+T,who:"believer",painDone:"feeling stuck with "+low,painShort:"Stuck",resultShort:"Thriving in "+T,result:"grow in "+low,resultIng:"growing with confidence"};
}

/* ---------- State ---------- */
var S={view:"home",mode:null,i:0,a:{},idea:"",price:47,custom:""};

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function money(n){return "$"+Math.round(n).toLocaleString("en-US")}
function go(v){S.view=v;render();window.scrollTo({top:0});var h=app.querySelector("h1,h2");if(h){h.setAttribute("tabindex","-1");h.focus({preventScroll:true})}}

var NLC_URL="https://nextlevelcontent.danyacollyer.com/";
var CHALLENGE_START=new Date("2026-10-05T00:00:00-05:00").getTime(); /* midnight Central */
var timerId=null;
function wireTimer(){
  if(timerId){clearInterval(timerId);timerId=null}
  var box=document.getElementById("challenge");if(!box)return;
  function tick(){
    var ms=CHALLENGE_START-Date.now();
    if(ms<=0){clearInterval(timerId);timerId=null;box.remove();return}
    var s=Math.floor(ms/1000),v={d:Math.floor(s/86400),h:Math.floor(s%86400/3600),m:Math.floor(s%3600/60),s:s%60};
    Object.keys(v).forEach(function(k){box.querySelector('[data-t="'+k+'"]').textContent=(k==="d"?v[k]:String(v[k]).padStart(2,"0"))});
  }

/* ---------- Views ---------- */
function home(){
  return '<h1>What are you called to create?</h1>'+
  '<p class="lede">Find the digital product that fits your gifts, your story and your season, or test the idea you already have before you spend weeks building it.</p>'+
  '<div class="paths">'+
    '<button class="path" data-act="find"><span class="t">Help me find my product</span><span class="d">Five quick questions. You\u2019ll get a product idea, a price range, a profit estimate and hooks to start promoting it.</span></button>'+
    '<button class="path" data-act="validate"><span class="t">Test the idea I already have</span><span class="d">Six honest questions. You\u2019ll get a readiness score and exactly what to strengthen before you launch.</span></button>'+
  '</div>'+
  '<p class="verse">\u201cCommit your work to the LORD, and your plans will be established.\u201d<span>Proverbs 16:3 (ESV)</span></p>';
}

function question(list){
  var q=list[S.i], total=list.length, pct=Math.round((S.i)/total*100);
  var h='<div class="progress" aria-hidden="true"><i style="width:'+pct+'%"></i></div>'+
    '<div class="step"><span>Question '+(S.i+1)+' of '+total+'</span><button class="back" data-act="back">Back</button></div>'+
    '<h2>'+esc(q.q)+'</h2>'+(q.help?'<p class="help">'+esc(q.help)+'</p>':'')+
    '<div class="opts'+(q.two?' two':'')+'" role="group" aria-label="'+esc(q.q)+'">';
  q.opts.forEach(function(o){
    var sel=String(S.a[q.key])===String(o[0]);
    h+='<button class="opt" data-pick="'+esc(o[0])+'" aria-pressed="'+sel+'">'+esc(o[1])+(o[2]?'<small>'+esc(o[2])+'</small>':'')+'</button>';
  });
  h+='</div>';
  if(q.key==="topic"&&S.a.topic==="other"){
    h+='<div class="row" style="margin-top:22px"><label class="f" for="custom">What do people come to you for?</label>'+
      '<input id="custom" type="text" maxlength="40" placeholder="e.g. Photography, homeschooling, public speaking" value="'+esc(S.custom)+'">'+
      '<div class="error" id="err"></div></div>'+
      '<div class="actions" style="margin-top:8px"><button class="btn" data-act="customNext">Continue</button></div>';
  }
  return h;
}

function ideaStep(){
  return '<div class="progress" aria-hidden="true"><i style="width:0%"></i></div>'+
  '<div class="step"><span>Before we start</span><button class="back" data-act="home">Back</button></div>'+
  '<h2>Tell me about your idea</h2>'+
  '<label class="f" for="idea">What\u2019s the product?</label>'+
  '<textarea id="idea" placeholder="e.g. A 30-day prayer journal for moms who want to pray with more confidence">'+esc(S.idea)+'</textarea>'+
  '<div class="row" style="margin-top:20px"><label class="f" for="price">What would you charge?</label>'+
  '<div class="priceIn"><span>$</span><input id="price" type="number" min="1" step="1" inputmode="numeric" value="'+S.price+'"></div></div>'+
  '<div class="error" id="err"></div>'+
  '<div class="actions"><button class="btn" data-act="startVal">Start the questions</button></div>';
}

function calc(price, audKey){
  var n=AUDIENCE[audKey||"small"].n;
  return '<div class="calc" id="calc">'+
    '<div class="row"><div class="top"><label for="cPrice">Price</label><output id="oPrice"></output></div><input id="cPrice" type="range" min="7" max="997" step="1" value="'+price+'"></div>'+
    '<div class="row"><div class="top"><label for="cAud">Followers + subscribers</label><output id="oAud"></output></div><input id="cAud" type="range" min="200" max="50000" step="100" value="'+n+'"></div>'+
    '<div class="row"><div class="top"><label for="cConv">Buy rate of people who see the offer</label><output id="oConv"></output></div><input id="cConv" type="range" min="0.5" max="5" step="0.5" value="2"></div>'+
    '<div class="totals"><div><strong id="tLaunch"></strong>from one launch</div><div><strong id="tYear"></strong>in a year, promoting monthly</div></div>'+
    '<p class="fine">This is an estimate, not a promise. It assumes about 1 in 4 of your audience sees a launch, and that monthly promotion afterward brings in about half a launch\u2019s sales each month.</p>'+
  '</div>';
}
function wireCalc(){
  var p=document.getElementById("cPrice");if(!p)return;
  var a=document.getElementById("cAud"),c=document.getElementById("cConv");
  function upd(){
    var price=+p.value,aud=+a.value,conv=+c.value/100;
    var buyers=aud*0.25*conv, launch=buyers*price, year=launch+launch*0.5*11;
    document.getElementById("oPrice").textContent=money(price);
    document.getElementById("oAud").textContent=aud.toLocaleString("en-US");
    document.getElementById("oConv").textContent=c.value+"%";
    document.getElementById("tLaunch").textContent=money(launch);
    document.getElementById("tYear").textContent=money(year);
  }
  [p,a,c].forEach(function(el){el.addEventListener("input",upd)});upd();
}

function findResult(){
  var t=topicFor(),e=EXPERIENCE[S.a.exp],f=FORMATS[S.a.style][S.a.time];
  var lo=Math.round(f.lo*e.mult),hi=Math.round(f.hi*e.mult);
  var suggested=Math.round((lo+hi)/2);
  var main=t.outcome+" in "+f.days+" Days";
  var alts=["The "+t.theme+" "+f.name,"From "+t.painShort+" to "+t.resultShort];
  var article=/^[AEIOU]/i.test(f.name)?"an":"a";
  var hooks=[
    ["Identity hook","I\u2019m a "+t.who+" and I was done "+t.painDone+"."],
    ["Curiosity hook","The one shift that finally helped me "+t.result+"."],
    ["Transformation hook","How I went from "+t.painShort.toLowerCase()+" to "+t.resultShort.toLowerCase()+", and the "+f.days+"-day plan I\u2019d give you."],
    ["POV hook","POV: you stopped "+t.painDone+" and started "+t.resultIng+"."]
  ];
  S.summary=["My product blueprint","","Product: "+main+" ("+f.name+")","Other titles: "+alts.join(" / "),"Price range: "+money(lo)+"–"+money(hi),"Build time: "+f.build,"","Hooks:"].concat(hooks.map(function(h){return"- "+h[1]})).join("\n");
  return '<div class="cover">'+
    '<div class="medallion" aria-hidden="true">DC</div>'+
    '<div class="kicker">Your product blueprint</div>'+
    '<p class="title">'+esc(main)+'</p>'+
    '<div class="meta"><span>Format <b>'+esc(f.name)+'</b></span><span>Price <b>'+money(lo)+'–'+money(hi)+'</b></span><span>Build time <b>'+esc(f.build)+'</b></span></div>'+
  '</div>'+
  '<section class="block"><h2>Why this fits you</h2>'+
    '<p>You teach best through '+({writing:"writing",tools:"practical tools",video:"video",live:"live experiences"})[S.a.style]+', and you have '+esc(f.build)+' to build. '+article+' '+esc(f.name.toLowerCase())+' lets you deliver a real win without overbuilding.</p>'+
    '<p>'+esc(e.note)+'</p></section>'+
  '<section class="block"><h2>Other titles to try</h2><ul class="alts">'+alts.map(function(x){return'<li>'+esc(x)+'</li>'}).join("")+'</ul></section>'+
  '<section class="block"><h2>What could it earn?</h2><p class="help">Move the sliders to match your real numbers.</p>'+calc(suggested,S.a.aud)+'</section>'+
  '<section class="block"><h2>Start promoting it this week</h2><p class="help">Four hooks built on the Content Formula. Tweak the words so they sound like you.</p><ul class="hooks">'+
    hooks.map(function(h){return'<li><em>'+h[0]+'</em>'+esc(h[1])+'</li>'}).join("")+'</ul></section>'+
  '<section class="block next"><h3>Your next step</h3><p>Before you build anything, post two of these hooks this week and put a waitlist link in your bio. Pay attention to who replies. Those people are your first buyers.</p></section>'+
  pitch("A great product only changes lives when people see it. The hooks above come straight from the Content Formula, and that\u2019s just one piece of the system.")+
  '<div class="actions"><button class="btn ghost" data-act="copy">Copy my blueprint</button><button class="btn ghost" data-act="home">Start over</button></div><div class="error" id="copyMsg" role="status"></div>';
}

function valResult(){
  var pts=0;VAL_Q.forEach(function(q){pts+=+S.a[q.key]});
  var pct=Math.round(pts/(VAL_Q.length*2)*100);
  var verdict=pct>=75?["Green light","This idea is ready. Build the first version, open a waitlist, and start talking about it now."]
    :pct>=45?["Refine it first","There\u2019s something real here. Strengthen the areas marked below before you invest weeks building."]
    :["Rework the idea","Don\u2019t throw it out, but don\u2019t build it yet. Use the notes below to reshape it into something people are ready to buy."];
  var sorted=VAL_Q.slice().sort(function(a,b){return S.a[a.key]-S.a[b.key]});
  S.summary=["Idea check: "+S.idea,"Score: "+pct+"/100 ("+verdict[0]+")",""].concat(sorted.map(function(q){return(+S.a[q.key]===2?"Strong: ":"Work on: ")+q.q+" "+(+S.a[q.key]===2?q.hi:q.lo)})).join("\n");
  return '<div class="cover">'+
    '<div class="kicker">Your idea check</div>'+
    '<p class="title">'+esc(S.idea)+'</p>'+
    '<div class="score"><div class="ring" style="--p:'+pct+'" role="img" aria-label="Score '+pct+' out of 100"><span>'+pct+'</span></div>'+
    '<div><p style="font-family:var(--serif);font-size:26px;margin:0 0 6px">'+verdict[0]+'</p><p style="margin:0;color:var(--panel-soft)">'+verdict[1]+'</p></div></div>'+
  '</div>'+
  '<section class="block"><h2>What to strengthen</h2><ul class="checks">'+
    sorted.map(function(q){var hi=+S.a[q.key]===2;return'<li class="'+(hi?"hi":"lo")+'"><b>'+esc(q.q)+'</b><p>'+esc(hi?q.hi:q.lo)+'</p></li>'}).join("")+
  '</ul></section>'+
  '<section class="block"><h2>What could it earn?</h2><p class="help">Move the sliders to match your real numbers.</p>'+calc(S.price,"small")+'</section>'+
  pitch("A validated idea only changes lives when people see it. The fastest way to prove demand, fill a waitlist and sell your product is content that does double duty.")+
  '<div class="actions"><button class="btn ghost" data-act="copy">Copy my results</button><button class="btn ghost" data-act="home">Start over</button></div><div class="error" id="copyMsg" role="status"></div>';
}

function render(){
  var h;
  if(S.view==="home")h=home();
  else if(S.view==="find")h=question(FIND_Q);
  else if(S.view==="idea")h=ideaStep();
  else if(S.view==="val")h=question(VAL_Q);
  else if(S.view==="findResult")h=findResult();
  else h=valResult();
  app.innerHTML=h;wireCalc();wireTimer();
}

/* ---------- Events ---------- */
app.addEventListener("click",function(ev){
  var b=ev.target.closest("button");if(!b)return;
  var act=b.getAttribute("data-act"),pick=b.getAttribute("data-pick");
  if(pick!==null){
    var list=S.view==="find"?FIND_Q:VAL_Q;
    S.a[list[S.i].key]=pick;
    if(list[S.i].key==="topic"&&pick==="other"){render();var ci=document.getElementById("custom");if(ci)ci.focus();return}
    if(S.i<list.length-1){S.i++;go(S.view)}
    else go(S.view==="find"?"findResult":"valResult");
    return;
  }
  if(act==="find"){S.a={};S.i=0;go("find")}
  else if(act==="validate"){S.a={};S.i=0;go("idea")}
  else if(act==="home"){go("home")}
  else if(act==="customNext"){
    var v=document.getElementById("custom").value.trim().replace(/[.!?]+$/,"");
    if(v.length<3){document.getElementById("err").textContent="Type a topic in a few words to continue.";return}
    S.custom=v;S.i++;go("find");
  }
  else if(act==="back"){if(S.i>0){S.i--;go(S.view)}else go(S.view==="val"?"idea":"home")}
  else if(act==="startVal"){
    var idea=document.getElementById("idea").value.trim(),price=parseInt(document.getElementById("price").value,10);
    var err=document.getElementById("err");
    if(!idea){err.textContent="Describe your idea in a sentence to continue.";return}
    if(!(price>0)){err.textContent="Enter a price in whole dollars to continue.";return}
    S.idea=idea;S.price=Math.min(price,997);go("val");
  }
  else if(act==="copy"){
    var msg=document.getElementById("copyMsg");
    try{
      navigator.clipboard.writeText(S.summary).then(function(){msg.style.color="var(--good)";msg.textContent="Copied. Paste it into your notes."},function(){fallback()});
    }catch(e){fallback()}
    function fallback(){
      var ta=document.createElement("textarea");ta.value=S.summary;document.body.appendChild(ta);ta.select();
      var ok=false;try{ok=document.execCommand("copy")}catch(e){}
      document.body.removeChild(ta);
      msg.style.color=ok?"var(--good)":"var(--bad)";
      msg.textContent=ok?"Copied. Paste it into your notes.":"Copying isn\u2019t allowed here. Take a screenshot to save your results.";
    }
  }
});

app.addEventListener("keydown",function(ev){
  if(ev.key==="Enter"&&ev.target.id==="custom"){ev.preventDefault();var b=app.querySelector('[data-act="customNext"]');if(b)b.click()}
});

render();
})();
</script>
